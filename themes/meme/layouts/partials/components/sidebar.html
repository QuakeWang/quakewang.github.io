<div class="sidebar-container">
    <div class="sidebar-wrapper">
        <div class="sidebar-header">
            <span class="sidebar-title">{{ i18n "tocTitle" }}</span>
        </div>
        <div class="sidebar-body">
            <div class="toc-container">
                {{ .TableOfContents }}
            </div>
        </div>
        <div class="reading-progress" role="progressbar" aria-label="{{ i18n "readingProgress" }}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span>{{ i18n "readingProgress" }}</span>
            <span class="progress-percentage" aria-hidden="true">0%</span>
        </div>
    </div>
</div>
